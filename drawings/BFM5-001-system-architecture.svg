<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
    <style>
      .line{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:1.5;fill:none}
      .dash{stroke:#111;stroke-width:2;fill:none;stroke-dasharray:10 8}.box{stroke:#111;stroke-width:3;fill:#fff}
      .shade{stroke:#111;stroke-width:3;fill:#eee}.title{font:700 32px Arial}.h{font:700 22px Arial}
      .t{font:18px Arial}.s{font:15px Arial}.mono{font:17px 'Courier New',monospace}
    </style>
  </defs>
  <rect x="20" y="20" width="1360" height="860" class="box"/>
  <text x="55" y="70" class="title">BFM5-001 — SIX-PORT FUNCTIONAL ARCHITECTURE</text>
  <text x="55" y="105" class="t">Baseline G0 · Not to scale · State-independent phase continuity</text>

  <g>
    <text x="55" y="180" class="h">PORTS</text>
    <text x="70" y="235" class="mono">U1</text><line x1="110" y1="228" x2="320" y2="228" class="line"/>
    <text x="70" y="285" class="mono">V1</text><line x1="110" y1="278" x2="320" y2="278" class="line"/>
    <text x="70" y="335" class="mono">W1</text><line x1="110" y1="328" x2="320" y2="328" class="line"/>
    <text x="70" y="435" class="mono">U2</text><line x1="110" y1="428" x2="320" y2="428" class="line"/>
    <text x="70" y="485" class="mono">V2</text><line x1="110" y1="478" x2="320" y2="478" class="line"/>
    <text x="70" y="535" class="mono">W2</text><line x1="110" y1="528" x2="320" y2="528" class="line"/>
  </g>

  <rect x="320" y="155" width="700" height="450" rx="30" class="box"/>
  <text x="355" y="200" class="h">PERMANENT OUTER Z/CM CORE</text>
  <text x="355" y="230" class="t">All six conductors traverse one common window; never bypassed.</text>
  <rect x="390" y="265" width="560" height="270" rx="20" class="shade"/>
  <text x="425" y="305" class="h">SWITCHABLE INNER DIFFERENTIAL CORE</text>

  <rect x="450" y="350" width="170" height="110" class="box"/>
  <rect x="720" y="350" width="170" height="110" class="box"/>
  <text x="495" y="410" class="h">αΔ</text>
  <text x="765" y="410" class="h">βΔ</text>
  <line x1="535" y1="460" x2="535" y2="505" class="line"/>
  <line x1="805" y1="460" x2="805" y2="505" class="line"/>
  <rect x="500" y="500" width="340" height="45" class="box"/>
  <text x="545" y="530" class="t">SHARED RETURN KEEPER</text>

  <text x="1045" y="245" class="h">NORMAL</text>
  <text x="1045" y="278" class="t">Keeper seated</text>
  <text x="1045" y="307" class="t">LΔ high</text>
  <line x1="1020" y1="300" x2="930" y2="405" class="thin" marker-end="url(#arrow)"/>

  <text x="1045" y="405" class="h">FAULT</text>
  <text x="1045" y="438" class="t">Keeper withdrawn</text>
  <text x="1045" y="467" class="t">LΔ ≈ leakage</text>
  <text x="1045" y="496" class="t">Z/CM retained</text>
  <line x1="1020" y1="460" x2="840" y2="522" class="thin" marker-end="url(#arrow)"/>

  <line x1="1020" y1="228" x2="1290" y2="228" class="line"/>
  <line x1="1020" y1="278" x2="1290" y2="278" class="line"/>
  <line x1="1020" y1="328" x2="1290" y2="328" class="line"/>
  <line x1="1020" y1="428" x2="1290" y2="428" class="line"/>
  <line x1="1020" y1="478" x2="1290" y2="478" class="line"/>
  <line x1="1020" y1="528" x2="1290" y2="528" class="line"/>
  <text x="1230" y="180" class="h">MOTOR</text>

  <rect x="55" y="650" width="1290" height="170" class="box"/>
  <text x="80" y="690" class="h">INVARIANTS</text>
  <text x="80" y="725" class="t">1 · No conductive phase-to-phase bridge.   2 · Both Δ axes switch together.</text>
  <text x="80" y="758" class="t">3 · Z/CM path remains active.   4 · Default de-energized state is FAULT/high reluctance.</text>
  <text x="80" y="791" class="t">5 · State change requires controlled iΔ and an energy sink.</text>

  <text x="55" y="855" class="s">Owner: BFM-5 Project · Source: docs/01_ARCHITECTURE.md · Revision: v0.1.0 · 2026-08-04</text>
</svg>
