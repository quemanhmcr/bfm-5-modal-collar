<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker>
    <style>
      .box{stroke:#111;stroke-width:3;fill:#fff}.shade{stroke:#111;stroke-width:3;fill:#e8e8e8}
      .line{stroke:#111;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#111;stroke-width:2;fill:none;stroke-dasharray:9 7;marker-end:url(#arrow)}
      .title{font:700 31px Arial}.h{font:700 21px Arial}.t{font:17px Arial}.s{font:14px Arial}
    </style>
  </defs>
  <rect x="20" y="20" width="1460" height="720" class="box"/>
  <text x="55" y="70" class="title">BFM5-003 — CONTROLLED NORMAL-TO-FAULT SEQUENCE</text>
  <text x="55" y="105" class="t">No state transition without current control, energy path, and position verification</text>

  <rect x="70" y="190" width="230" height="180" rx="18" class="shade"/>
  <text x="140" y="230" class="h">NORMAL</text>
  <text x="105" y="270" class="t">Keeper seated</text>
  <text x="105" y="300" class="t">LΔ high</text>
  <text x="105" y="330" class="t">Both sets healthy</text>

  <rect x="380" y="190" width="250" height="180" rx="18" class="box"/>
  <text x="440" y="230" class="h">PREPARE</text>
  <text x="415" y="270" class="t">Isolate failed set</text>
  <text x="415" y="300" class="t">Reduce |iΔ|</text>
  <text x="415" y="330" class="t">Verify threshold</text>

  <rect x="710" y="190" width="250" height="180" rx="18" class="box"/>
  <text x="760" y="230" class="h">DISCHARGE</text>
  <text x="745" y="270" class="t">Arm clamp/DC link</text>
  <text x="745" y="300" class="t">Release keeper</text>
  <text x="745" y="330" class="t">Absorb ΔEm</text>

  <rect x="1040" y="190" width="250" height="180" rx="18" class="shade"/>
  <text x="1120" y="230" class="h">FAULT</text>
  <text x="1075" y="270" class="t">Keeper withdrawn</text>
  <text x="1075" y="300" class="t">LΔ ≈ leakage</text>
  <text x="1075" y="330" class="t">Z/CM retained</text>

  <line x1="300" y1="280" x2="380" y2="280" class="line"/>
  <line x1="630" y1="280" x2="710" y2="280" class="line"/>
  <line x1="960" y1="280" x2="1040" y2="280" class="line"/>

  <text x="305" y="255" class="s">fault detected</text>
  <text x="635" y="255" class="s">|iΔ| ≤ IΔ,open</text>
  <text x="965" y="255" class="s">position verified</text>

  <rect x="150" y="470" width="1200" height="160" class="box"/>
  <text x="185" y="510" class="h">TRANSITION INVARIANTS</text>
  <text x="185" y="548" class="t">ΔEm = ½ iᵀ(LN − LF)i must have a rated sink.</text>
  <text x="185" y="582" class="t">Opening must not increase Bmax. Closing is inhibited above IΔ,close.</text>
  <text x="185" y="616" class="t">Unknown keeper position is treated as FAULT until the six-port state is identified.</text>

  <path d="M1165 370 C1165 440, 505 440, 505 370" class="dash"/>
  <text x="720" y="430" class="s">Recovery only after both sets healthy and low iΔ</text>

  <text x="55" y="705" class="s">Source: docs/04_RECONFIGURATION.md · Revision v0.1.0 · 2026-08-04</text>
</svg>
