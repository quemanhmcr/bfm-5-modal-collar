version: 4.0
stage: TCZ-1E-dynamic-root-tracking
plant_model:
  constitutive_coordinates: [absolute_branch_mmf, controlled_gap]
  route_surface_source: FEMM
  surface_grid:
    gap_mm: [1.0, 2.2]
    branch_mmf_Aturn: [0.0, 2200.0]
  full_device_correction_fields: [psi, Ld, Kq, generalized_force, coenergy]
  correction_angles_deg: [-2.0, 0.0, 2.0]
  rule: >-
    A dynamic reduced model is acceptable only when its full-device correction
    is locally generated by one coenergy expansion. Independently patched psi,
    Kq and generalized force are not sufficient for an energy audit.
dark_visible_control:
  root_equations:
    - psi(i,q) = psi_reference(i)
    - b(i,q)^T d(i,q) = 0
    - Kq(i,q) d(i,q) = 0
  implicit_root_velocity: qdot_star = -Fq_inverse Fi idot
  governor_objective:
    - track scheduled root velocity
    - restore reference flux
    - suppress b^T qdot
    - enforce slew and branch bounds
  terminal_capture: >-
    Use a separate end-hold power weight. A single power penalty cannot be
    simultaneously optimal during the moving sweep and terminal settling.
voltage_control:
  accepted_law: v = R i_reference + d(psi_reference)/dt + current_feedback
  rejected_law: accepted_law + Kq qdot
  reason: >-
    On the root manifold Ld idot + Kq qdot equals the reference flux rate.
    Adding Kq qdot explicitly double-counts the visible geometry contribution.
  measured_current_error_penalty_of_direct_compensation: 2.6244250249122527
fair_terminal_benchmark:
  duration_s: 1.5
  angle_range_deg: [-2.0, 2.0]
  same_start_end_time_slew_bounds: true
  root_vs_minimum_effort_chord:
    rms_strong_dark_ratio: 0.17849310511950048
    max_strong_dark_ratio: 0.2023661499237463
    metric_power_squared_ratio: 0.7763798623099321
    actuator_voltage_squared_ratio: 1.1485132041474544
    actuator_effort_ratio: 1.1466198244018657
    rms_flux_error_ratio: 1.5035296390705528
  interpretation: >-
    Root tracking is not actuator-effort dominant. It buys an 82.15 percent
    readiness improvement and 22.36 percent metric-power reduction with about
    14.7 percent more actuator effort and 14.9 percent more Kq-qdot voltage burden.
dynamic_rate_limits:
  exact_manifold_slew_bound_deg_per_s: 14.350467548604342
  quality_constrained_boundary:
    sweep_s: 0.236
    peak_angle_rate_deg_per_s: 26.623666555845706
    max_strong_dark_discriminant: 0.009976122499618583
    terminal_error_mm: 0.004679441343929099
  quality_to_exact_rate_ratio: 1.855251486700058
  robust_recommended_sweep_s: 0.40
robustness_demonstrated:
  boundary_sweep_s: 0.30
  minimum_slew_mm_per_s: 0.35
  tested_measurement_delay_ms: 60.0
  robust_sweep_s: 0.40
  tested_actuator_time_constant_ms: 80.0
  tested_angle_noise_std_deg: 0.10
  monte_carlo_samples_per_noise_level: 12
  pass_probability_at_max_tested_noise: 1.0
energy_audit:
  identity: iT_v = iT_R_i + d(iT_psi_minus_Wprime)/dt + bT_qdot
  final_root_normalized_residual: 6.202047024149141e-07
policies:
  low_metric_power:
    moving_power_weight: 500.0
    terminal_capture_power_weight: 300.0
  high_rate:
    moving_power_weight: 500.0
    terminal_capture_power_weight: 275.0
next_stage:
  name: TCZ-1F-implicit-root-connection
  objective: >-
    Replace the three-point angle table by an online differential root model
    A(i)=-Fq^{-1}Fi, map the condition number of Fq over a two-dimensional
    current domain, and detect folds or loss of root existence before hardware.
