accepted_modes:
  economy:
    path: geodesic
    accepted: true
    activation: deadline margin available; use declared or robustly feasible motion
      time
    benefit: robust reduction of metric-power and actuator-voltage
    cost: higher actual actuator effort and slightly longer minimum time
  deadline:
    path_family: online_slew_reweighted_polytope
    fixed_nominal_path_accepted: false
    activation: tight transition deadline
    requirement: re-estimate route slew and replan before or during transition
    reason: nominal time advantage is about one percent and loses robust dominance
      under route-specific mismatch
  fallback:
    path: straight_current
    activation: uncertain calibration, planner failure, or objective-neutral operation
    benefit: neutral baseline and lowest nominal dynamic actuator effort
rejected_claims:
- geodesic universally minimizes actuator effort in closed-loop dynamics
- polytope path is robustly fastest when actuator slew calibration is uncertain
- one fixed path dominates all electrical, mechanical, and timing objectives
next_stage:
  name: TCZ-1H-online-Pareto-root-navigation
  core: online calibration, objective-weighted path optimization, and mode switching
    on the strong-dark manifold
