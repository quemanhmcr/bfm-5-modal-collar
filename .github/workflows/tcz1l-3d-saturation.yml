name: TCZ-1L Missing-Shard EXEC 421c937c

on:
  workflow_dispatch:
    inputs:
      cache_generation:
        description: FEA3D cache namespace
        required: true
        default: v1
  push:
    branches:
      - research/tcz1l-missing-421c937c
    paths:
      - '.github/actions/setup-fea3d/action.yml'
      - '.github/workflows/tcz1l-3d-saturation.yml'
      - 'fea/bfm5/tcz1k_3d.py'
      - 'fea/bfm5/tcz1l_3d.py'
      - 'fea/config/tcz1k_3d_nonlinear_holdout.yml'
      - 'fea/config/tcz1l_3d_saturation_critical_surface.yml'
      - 'fea/scripts/run_tcz1k_3d_nonlinear_holdout.py'
      - 'fea/scripts/run_tcz1l_3d_critical_surface.py'
      - 'fea/scripts/analyze_tcz1l_3d_critical_surface.py'
      - 'fea/scripts/seal_tcz1l_3d_evidence.py'
      - 'fea/tests/test_tcz1l_3d.py'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: '.'
  OMP_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  NUMBA_NUM_THREADS: '4'

jobs:
  shard:
    name: shard-${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {label: state-high_skew-2p40, kind: state, ray: high_skew, scale: '2.4', case: ''}
          - {label: state-rotated_a-2p40, kind: state, ray: rotated_a, scale: '2.4', case: ''}
          - {label: state-rotated_a-3p20, kind: state, ray: rotated_a, scale: '3.2', case: ''}
          - {label: state-rotated_b-2p40, kind: state, ray: rotated_b, scale: '2.4', case: ''}
          - {label: numerical-mesh_mid, kind: numerical, ray: '', scale: '', case: mesh_mid}
          - {label: numerical-mesh_fine, kind: numerical, ray: '', scale: '', case: mesh_fine}
          - {label: numerical-boundary_far, kind: numerical, ray: '', scale: '', case: boundary_far}
          - {label: topology-high_skew, kind: topology, ray: high_skew, scale: '', case: ''}
          - {label: topology-rotated_a, kind: topology, ray: rotated_a, scale: '', case: ''}
          - {label: uncertainty-soft_material, kind: uncertainty, ray: '', scale: '', case: soft_material}
    defaults:
      run:
        working-directory: fea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore pinned reusable FEA3D layer
        uses: ./.github/actions/setup-fea3d
        with:
          python-version: '3.12'
          cache-generation: ${{ inputs.cache_generation || 'v1' }}
      - name: Validate frozen critical-surface mathematics
        run: python -m pytest -q tests/test_tcz1l_3d.py
      - name: Run saturation critical-surface shard
        env:
          TCZ1L_KIND: ${{ matrix.kind }}
          TCZ1L_RAY: ${{ matrix.ray }}
          TCZ1L_SCALE: ${{ matrix.scale }}
          TCZ1L_CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          out="results_ci/tcz1l_${{ matrix.label }}"
          mkdir -p "$out"
          args=(--kind "$TCZ1L_KIND" --output "$out")
          if [ -n "$TCZ1L_RAY" ]; then args+=(--ray "$TCZ1L_RAY"); fi
          if [ -n "$TCZ1L_SCALE" ]; then args+=(--scale "$TCZ1L_SCALE"); fi
          if [ -n "$TCZ1L_CASE" ]; then args+=(--case "$TCZ1L_CASE"); fi
          python scripts/run_tcz1l_3d_critical_surface.py "${args[@]}" | tee "$out/run.log"
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tcz1l-shard-${{ matrix.label }}-${{ github.run_id }}
          path: fea/results_ci/tcz1l_${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 14
