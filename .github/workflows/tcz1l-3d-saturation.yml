name: TCZ-1L Saturation Critical-Surface Holdout

on:
  workflow_dispatch:
    inputs:
      cache_generation:
        description: FEA3D cache namespace
        required: true
        default: v1
  push:
    branches:
      - research/tcz1l-saturation-critical-surface
    paths:
      - '.github/actions/setup-fea3d/action.yml'
      - '.github/workflows/tcz1l-3d-saturation.yml'
      - 'fea/bfm5/tcz1k_3d.py'
      - 'fea/bfm5/tcz1l_3d.py'
      - 'fea/config/tcz1k_3d_nonlinear_holdout.yml'
      - 'fea/config/tcz1l_3d_saturation_critical_surface.yml'
      - 'fea/scripts/run_tcz1k_3d_nonlinear_holdout.py'
      - 'fea/scripts/run_tcz1l_3d_critical_surface.py'
      - 'fea/scripts/analyze_tcz1l_3d_critical_surface.py'
      - 'fea/scripts/seal_tcz1l_3d_evidence.py'
      - 'fea/tests/test_tcz1l_3d.py'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: '.'
  OMP_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  NUMBA_NUM_THREADS: '4'

concurrency:
  group: tcz1l-3d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shard:
    name: shard-${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {label: state-high_skew-1p00, kind: state, ray: high_skew, scale: '1.0', case: ''}
          - {label: state-high_skew-1p35, kind: state, ray: high_skew, scale: '1.35', case: ''}
          - {label: state-high_skew-1p80, kind: state, ray: high_skew, scale: '1.8', case: ''}
          - {label: state-high_skew-2p40, kind: state, ray: high_skew, scale: '2.4', case: ''}
          - {label: state-high_skew-3p20, kind: state, ray: high_skew, scale: '3.2', case: ''}
          - {label: state-rotated_a-1p00, kind: state, ray: rotated_a, scale: '1.0', case: ''}
          - {label: state-rotated_a-1p35, kind: state, ray: rotated_a, scale: '1.35', case: ''}
          - {label: state-rotated_a-1p80, kind: state, ray: rotated_a, scale: '1.8', case: ''}
          - {label: state-rotated_a-2p40, kind: state, ray: rotated_a, scale: '2.4', case: ''}
          - {label: state-rotated_a-3p20, kind: state, ray: rotated_a, scale: '3.2', case: ''}
          - {label: state-rotated_b-1p00, kind: state, ray: rotated_b, scale: '1.0', case: ''}
          - {label: state-rotated_b-1p35, kind: state, ray: rotated_b, scale: '1.35', case: ''}
          - {label: state-rotated_b-1p80, kind: state, ray: rotated_b, scale: '1.8', case: ''}
          - {label: state-rotated_b-2p40, kind: state, ray: rotated_b, scale: '2.4', case: ''}
          - {label: state-rotated_b-3p20, kind: state, ray: rotated_b, scale: '3.2', case: ''}
          - {label: numerical-mesh_mid, kind: numerical, ray: '', scale: '', case: mesh_mid}
          - {label: numerical-mesh_fine, kind: numerical, ray: '', scale: '', case: mesh_fine}
          - {label: numerical-boundary_far, kind: numerical, ray: '', scale: '', case: boundary_far}
          - {label: topology-high_skew, kind: topology, ray: high_skew, scale: '', case: ''}
          - {label: topology-rotated_a, kind: topology, ray: rotated_a, scale: '', case: ''}
          - {label: uncertainty-soft_material, kind: uncertainty, ray: '', scale: '', case: soft_material}
          - {label: uncertainty-combined_corner, kind: uncertainty, ray: '', scale: '', case: combined_corner}
    defaults:
      run:
        working-directory: fea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore pinned reusable FEA3D layer
        uses: ./.github/actions/setup-fea3d
        with:
          python-version: '3.12'
          cache-generation: ${{ inputs.cache_generation || 'v1' }}
      - name: Validate frozen critical-surface mathematics
        run: python -m pytest -q tests/test_tcz1l_3d.py
      - name: Run saturation critical-surface shard
        env:
          TCZ1L_KIND: ${{ matrix.kind }}
          TCZ1L_RAY: ${{ matrix.ray }}
          TCZ1L_SCALE: ${{ matrix.scale }}
          TCZ1L_CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          out="results_ci/tcz1l_${{ matrix.label }}"
          mkdir -p "$out"
          args=(--kind "$TCZ1L_KIND" --output "$out")
          if [ -n "$TCZ1L_RAY" ]; then args+=(--ray "$TCZ1L_RAY"); fi
          if [ -n "$TCZ1L_SCALE" ]; then args+=(--scale "$TCZ1L_SCALE"); fi
          if [ -n "$TCZ1L_CASE" ]; then args+=(--case "$TCZ1L_CASE"); fi
          python scripts/run_tcz1l_3d_critical_surface.py "${args[@]}" | tee "$out/run.log"
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tcz1l-shard-${{ matrix.label }}-${{ github.run_id }}
          path: fea/results_ci/tcz1l_${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 14

  aggregate-and-seal:
    name: aggregate-and-seal
    if: always()
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore pinned reusable FEA3D layer
        uses: ./.github/actions/setup-fea3d
        with:
          python-version: '3.12'
          cache-generation: ${{ inputs.cache_generation || 'v1' }}
      - name: Download all critical-surface shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tcz1l-shard-*-${{ github.run_id }}
          path: fea/results_ci/tcz1l_final/shards
      - name: Analyze critical surfaces
        run: python scripts/analyze_tcz1l_3d_critical_surface.py --evidence results_ci/tcz1l_final
      - name: Seal and enforce preregistered decision
        run: python scripts/seal_tcz1l_3d_evidence.py --evidence results_ci/tcz1l_final
      - name: Publish concise decision
        if: always()
        run: |
          if [ -f results_ci/tcz1l_final/summary.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          s=json.loads(Path('results_ci/tcz1l_final/summary.json').read_text())
          print('# TCZ-1L saturation critical surfaces')
          print(f"- Overall accepted: **{s['overall_saturation_critical_surface_accepted']}**")
          for k,v in s['partitioned_decision'].items(): print(f'- {k}: **{v}**')
          for ray,r in s['ray_event_reports'].items():
              print(f"- {ray}: saturation={r['first_saturated_scale']}, dark-failure={r['first_strong_dark_failure_scale']}, strict-overlap={r['first_strict_overlap_scale']}")
          n=s['numerical_qualification']['metrics']
          print(f"- exact tangent vs finite difference: **{n['exact_tangent_vs_finite_difference_spread']:.3%}**")
          PY
          fi
      - name: Upload immutable TCZ-1L evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tcz1l-3d-critical-surface-${{ github.run_id }}
          path: fea/results_ci/tcz1l_final/
          if-no-files-found: warn
          retention-days: 14
