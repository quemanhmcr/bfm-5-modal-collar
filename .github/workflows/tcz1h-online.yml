name: TCZ-1H Certified Online Navigator

on:
  push:
    branches:
      - research/tcz1f-action-grid
    paths:
      - '.github/workflows/tcz1h-online.yml'
      - 'fea/config/tcz1h_request.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: '.'

concurrency:
  group: tcz1h-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: fea/requirements-tcz1h.txt
      - name: Install pinned numerical toolchain
        run: python -m pip install --disable-pip-version-check -r requirements-tcz1h.txt
      - name: Validate TCZ-1H mathematics and integrity guards
        run: python -m pytest -q tests/test_tcz1h.py tests/test_tcz1g.py tests/test_remote_femm_policy.py
      - name: Assert solver-free execution
        shell: bash
        run: |
          if grep -R "import femm\|from femm" -n bfm5/tcz1h.py scripts/run_tcz1h_benchmark.py; then
            echo 'TCZ-1H must remain solver-free' >&2
            exit 2
          fi
      - name: Run certified candidate-bank benchmark
        run: python scripts/run_tcz1h_benchmark.py --output-root results_ci/tcz1h --workers 8
      - name: Verify artifact manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('results_ci/tcz1h')
          manifest = json.loads((root / 'artifact_manifest.json').read_text())
          errors = []
          for name, record in manifest.items():
              payload = (root / name).read_bytes()
              if len(payload) != int(record['bytes']):
                  errors.append(f'size:{name}')
              if hashlib.sha256(payload).hexdigest() != record['sha256']:
                  errors.append(f'sha256:{name}')
          if errors:
              raise SystemExit(errors)
          print(f'verified {len(manifest)} files')
          PY
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tcz1h-certified-${{ github.run_id }}
          path: fea/results_ci/tcz1h/
          if-no-files-found: error
          retention-days: 14
